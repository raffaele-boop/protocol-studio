<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtusan Protocol Studio</title>
<meta name="description" content="Creator-side back office for Virtusan's Scientific Advisory Board. Interface prototype with example data.">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<style>
/* Layout: creator back office. Dark ink sidebar (the "pro" side of Virtusan) + the same white page, violet haze and frosted cards as the Companion.
   Deliberately single (light) theme, matching the Companion app; every color is set explicitly. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#0f0b1a; --ink2:#5d5870; --ink3:#7d7889; --line:rgba(15,11,26,.08);
  --violet:#7f4e9e; --violet2:#a57fc4; --lilac:#ece2f4; --cta:#140e2e; --side:#140e2e;
  --glass:rgba(255,255,255,.7); --glass-b:rgba(255,255,255,.95);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 50px rgba(80,40,110,.08),0 2px 6px rgba(80,40,110,.04);
  --ok:#2f8f6a; --okbg:#e3f3ec; --warn:#b7791f; --warnbg:#fbf0dc; --bad:#c2414b; --badbg:#fbe5e7; --info:#4a6fd6; --infobg:#e6ecfb;
  --sf:"SF Pro Display",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sf);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font-family:inherit;letter-spacing:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
a{color:var(--violet)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* haze */
.haze{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(0deg,#000 0%,#000 25%,transparent 70%);mask-image:linear-gradient(0deg,#000 0%,#000 25%,transparent 70%)}
.haze i{position:absolute;border-radius:50%;filter:blur(90px)}
.haze .a{width:620px;height:520px;left:10%;bottom:-260px;background:#a57fc4;opacity:.32;animation:d1 22s ease-in-out infinite}
.haze .b{width:560px;height:460px;right:-140px;bottom:-160px;background:#dcc9ec;opacity:.55;animation:d2 26s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,-60px) scale(1.1)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-80px) scale(.92)}}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--side);color:#fff;padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;isolation:isolate}
.side::before{content:'';position:absolute;left:-80px;bottom:-120px;width:340px;height:300px;border-radius:50%;background:#7f4e9e;filter:blur(80px);opacity:.45;z-index:-1;pointer-events:none}
.brand{display:flex;flex-direction:column;gap:10px;padding:2px 10px 18px}
.brand img{height:22px;width:auto;align-self:flex-start}
.brand .st{display:flex;align-items:center;gap:8px}
.studio{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#e9dcf4}
.brand .st span{font-size:12px;color:rgba(255,255,255,.55)}
.ngroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.42);margin:14px 10px 4px}
.nav{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:11px;width:100%;min-height:40px;padding:8px 10px;border:0;border-radius:12px;background:none;color:rgba(255,255,255,.78);text-align:left;font-size:14px;font-weight:500;transition:background .2s,color .2s}
.nav svg{stroke:currentColor}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.nav .cnt{font-size:11px;font-weight:600;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--violet);color:#fff;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.nav .cnt.soft{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.sync{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;font-size:12px;color:rgba(255,255,255,.65)}
.sync b{color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#4fd39a;box-shadow:0 0 0 0 rgba(79,211,154,.6);animation:ping 2s infinite;flex:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(79,211,154,.55)}80%,100%{box-shadow:0 0 0 8px rgba(79,211,154,0)}}

.main{min-width:0;padding-inline:28px;padding-block:0 120px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding-block:16px 14px;background:linear-gradient(180deg,rgba(255,255,255,.95) 70%,rgba(255,255,255,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.iconbtn.burger{display:none}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;min-height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);padding:0 14px 0 40px;font-size:14px;color:var(--ink);outline:none}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);stroke:var(--ink3)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fff}
.top .sp{flex:1}
.livepill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.livepill .dot{background:var(--ok)}
.livepill b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.iconbtn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--shadow);padding:0}
.iconbtn svg{stroke:var(--ink)}
.iconbtn .b{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--violet);border:2px solid #fff}
.me{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--shadow)}
.av{width:34px;height:34px;border-radius:50%;background:var(--lilac);color:var(--violet);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.me small{display:block;font-size:11px;color:var(--ink3)}
.btn{border:0;border-radius:999px;background:var(--cta);color:#fff;font-size:14px;font-weight:600;min-height:42px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .2s}
.btn svg{stroke:#fff}
.btn:active{transform:scale(.97)}
.btn.v{background:var(--violet)}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ghost svg{stroke:currentColor}
.ghost.sm{min-height:30px;padding:0 11px;font-size:12px}
.ghost[aria-pressed="true"]{background:var(--cta);border-color:var(--cta);color:#fff}

/* page */
.view{animation:viewin .5s cubic-bezier(.22,1,.36,1) both}
@keyframes viewin{from{opacity:.001;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px}
.ph h1{font-size:clamp(28px,3.2vw,38px);line-height:1.05}
.ph p{margin:8px 0 0;color:var(--ink2);max-width:62ch;font-size:15px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;color:var(--violet);letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-radius:24px}
.card{padding:18px 20px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.ch h3{font-size:17px}
.ch .s{font-size:12px;color:var(--ink3)}
.ch a,.lnk{font-size:13px;font-weight:500;color:var(--violet);text-decoration:none;background:none;border:0;padding:0}
.grid{display:grid;gap:14px;margin-top:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:128px}
.kpi .l{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:7px}
.kpi .v{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--ink3);font-weight:400;margin-left:4px;letter-spacing:0}
.kpi .f{font-size:12px;color:var(--ink3);margin-top:auto;display:flex;align-items:center;gap:8px}
.kpi.dark{background:var(--cta);border-color:var(--cta);color:#fff}
.kpi.dark .l,.kpi.dark .f{color:rgba(255,255,255,.65)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.kpi.dark .up{color:#7fe0b6}
.flash{animation:flash .9s ease}
@keyframes flash{0%{color:var(--violet)}100%{}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:0}
.pill.live{background:var(--okbg);color:var(--ok)}
.pill.review{background:var(--infobg);color:var(--info)}
.pill.draft{background:rgba(15,11,26,.06);color:var(--ink2)}
.pill.due{background:var(--warnbg);color:var(--warn)}
.pill.ret{background:rgba(15,11,26,.04);color:var(--ink3);text-decoration:line-through}
.pill.hi{background:var(--badbg);color:var(--bad)}
.pill.med{background:var(--warnbg);color:var(--warn)}
.pill.lo{background:rgba(15,11,26,.06);color:var(--ink2)}
.pill.v{background:var(--lilac);color:var(--violet)}
.pill.dk{background:var(--cta);color:#fff}
.pill.ai{background:linear-gradient(90deg,#ece2f4,#e6ecfb);color:var(--violet)}
.tchip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--lilac);color:var(--ink);white-space:nowrap}

/* lists / rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ti b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ti span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.ic{width:36px;height:36px;border-radius:11px;background:var(--lilac);display:grid;place-items:center;flex:none}
.ic svg{stroke:var(--violet)}

.num{font-variant-numeric:tabular-nums;font-weight:600}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.muted{color:var(--ink3)}
.rank{font-family:var(--mono);font-size:12px;color:var(--ink3);width:20px;text-align:right}
.bar{height:6px;border-radius:6px;background:rgba(15,11,26,.07);overflow:hidden}
.bar b{display:block;height:100%;border-radius:6px;background:var(--violet);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.soft b{background:var(--violet2)}

/* tables */
.tw{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.01em}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(127,78,158,.04)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tname{display:flex;align-items:center;gap:11px;min-width:220px}
.tname b{display:block;font-weight:600}
.tname span{display:block;font-size:12px;color:var(--ink3)}

/* segmented + filters */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(15,11,26,.05);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;min-height:32px;padding:0 13px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(15,11,26,.08)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}

/* feed */
.feed{display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:hidden}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 2px;border-top:1px solid var(--line);font-size:13px}
.fi:first-child{border-top:0}
.fi.new{animation:slide .6s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{opacity:0;transform:translateY(-10px);background:rgba(127,78,158,.08)}to{opacity:1;transform:none}}
.fi .fic{width:28px;height:28px;border-radius:50%;background:var(--lilac);display:grid;place-items:center}
.fi .fic svg{stroke:var(--violet)}
.fi .fic.wn{background:var(--warnbg)}.fi .fic.wn svg{stroke:var(--warn)}
.fi .t{color:var(--ink2)}.fi .t b{color:var(--ink);font-weight:600}
.fi time{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}

/* AI gap cards */
.gap{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-radius:22px}
.gap .q{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.gap .q::before{content:'\201C'}.gap .q::after{content:'\201D'}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:8px;align-items:center}
.flow>div{padding:10px 12px;border-radius:14px;background:rgba(15,11,26,.035);font-size:12.5px;color:var(--ink2);min-width:0}
.flow>div b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.flow>div.miss{background:var(--warnbg)}.flow>div.miss b{color:var(--warn)}
.flow svg{stroke:var(--ink3);justify-self:center}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);align-items:center}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* split views */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-top:18px;align-items:start}
.sel{cursor:pointer;border:1px solid transparent}
.sel[aria-selected="true"]{border-color:var(--violet);box-shadow:0 0 0 3px rgba(127,78,158,.12),var(--shadow)}
.detail{position:sticky;top:84px}
.quote{font-size:13px;color:var(--ink2);padding:10px 12px;border-radius:12px;background:rgba(15,11,26,.035);margin:0}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:500}
.brief{padding:14px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(236,226,244,.7));border:1px solid var(--glass-b);font-size:13px}
.brief b{display:block;font-size:12px;color:var(--violet);margin-bottom:4px}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:18px;align-items:start}
.sect{padding:18px 20px}
.sect+.sect{margin-top:14px}
.sect h3{font-size:16px;display:flex;align-items:center;gap:10px}
.sect h3 .n{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.fld label{font-size:12px;color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;font-size:14px;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.fld textarea{min-height:76px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--violet2)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stp{display:grid;grid-template-columns:18px 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid var(--line)}
.stp .grip{color:var(--ink3);cursor:grab;font-size:14px;line-height:1}
.stp .tm{font-family:var(--mono);font-size:12px;color:var(--violet)}
.stp b{display:block;font-size:14px}.stp span{display:block;font-size:12px;color:var(--ink2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.chk:first-child{border-top:0}
.chk i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;font-size:11px;font-weight:700}
.chk i.ok{background:var(--okbg);color:var(--ok)}.chk i.w{background:var(--warnbg);color:var(--warn)}.chk i.x{background:var(--badbg);color:var(--bad)}
.chk span{color:var(--ink2)}.chk b{color:var(--ink);font-weight:600;display:block}

/* Companion preview: square-cornered screen frame */
.prev{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.screen{border-radius:0;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 30px 60px rgba(80,40,110,.14);position:relative;isolation:isolate;aspect-ratio:9/17;max-width:100%}
.screen::after{content:'';position:absolute;left:-60px;right:-60px;bottom:-120px;height:240px;background:radial-gradient(closest-side,rgba(165,127,196,.45),rgba(165,127,196,0));z-index:-1}
.scr{padding:18px 16px;display:flex;flex-direction:column;gap:10px;height:100%}
.scr .sb{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink)}
.scr .k{font-size:11px;color:var(--violet);font-weight:600;margin-top:8px}
.scr h4{font-size:20px;line-height:1.1}
.scr p{margin:0;font-size:12px;color:var(--ink2)}
.scr .by{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);padding:8px 10px;border-radius:12px;background:rgba(127,78,158,.07)}
.scr .by .av{width:24px;height:24px;font-size:10px}
.scr .st{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.scr .st .tm{font-family:var(--mono);font-size:10.5px;color:var(--violet)}
.scr .st b{display:block;font-size:12.5px}
.scr .play{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--cta);color:#fff;font-size:12px}
.scr .play i{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;margin-top:18px;overflow-x:auto;padding-bottom:6px}
.col{padding:12px;border-radius:20px;background:rgba(15,11,26,.03);display:flex;flex-direction:column;gap:10px;min-width:0}
.col h4{font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h4 span{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.kc{padding:12px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(80,40,110,.05);display:flex;flex-direction:column;gap:8px}
.kc b{font-size:13.5px;line-height:1.25}
.kc .m{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink3)}
.thumb{height:64px;border-radius:12px;background:radial-gradient(120% 90% at 50% 110%,#7f4e9e 0%,#2a1d4a 45%,#140e2e 100%);position:relative;display:grid;place-items:center}
.thumb svg{stroke:#fff}
.thumb.au{background:linear-gradient(135deg,#ece2f4,#dcc9ec)}
.thumb.au svg{stroke:var(--violet)}

/* journey builder */
.jb{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;margin-top:14px;overflow-x:auto;padding-bottom:6px}
.jst{display:flex;flex-direction:column;gap:8px;min-width:0}
.jst h4{font-size:13.5px;padding:0 4px;display:flex;flex-direction:column}
.jst h4 small{font-size:11.5px;color:var(--ink3);font-weight:400}
.jbk{padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.jbk b{font-size:13px}
.jbk.dp{background:linear-gradient(160deg,#fff,rgba(236,226,244,.8))}
.jbk.add{border-style:dashed;background:transparent;color:var(--ink3);align-items:center;justify-content:center;min-height:44px;cursor:pointer}
.jbk.sugg{border:1px dashed var(--violet2);background:rgba(236,226,244,.35)}

/* charts */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* overlays */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(420px,100vw);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-left:1px solid var(--glass-b);box-shadow:-20px 0 60px rgba(80,40,110,.15);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;animation:pin .4s cubic-bezier(.22,1,.36,1) both;display:flex;flex-direction:column;gap:12px}
@keyframes pin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panel .hd{display:flex;justify-content:space-between;align-items:center}
.panel .hd h3{font-size:20px}
.msg{padding:12px 14px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid var(--line);font-size:13.5px;line-height:1.45}
.msg.me2{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--cta);color:#fff;border-color:var(--cta);max-width:85%}
.msg ul{margin:6px 0 0;padding-left:18px}
.compose{margin-top:auto;display:flex;gap:8px}
.compose input{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);padding:0 16px;font-size:14px;background:#fff;color:var(--ink);outline:none;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--cta);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(20,14,46,.3);animation:viewin .35s cubic-bezier(.22,1,.36,1) both;max-width:calc(100vw - 40px)}

/* ink orb (same as Companion) */
.ink{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;width:60px;height:60px;border:0;padding:0;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 34% 28%,#ffffff 0%,#f3f1f6 34%,#dedae4 74%,#cbc6d3 100%);box-shadow:0 14px 34px rgba(80,40,110,.25),0 2px 6px rgba(80,40,110,.12)}
.ink-l{position:absolute;inset:-12%;filter:blur(5px);animation:spin 16s linear infinite}
.ink-l i{position:absolute;border-radius:50%;mix-blend-mode:multiply}
.ink-l i:nth-child(1){width:72%;height:58%;left:2%;top:40%;background:radial-gradient(circle,rgba(92,45,128,.95) 0%,rgba(127,78,158,.75) 35%,rgba(127,78,158,0) 68%);animation:i1 9s ease-in-out infinite}
.ink-l i:nth-child(2){width:58%;height:52%;right:0;top:6%;background:radial-gradient(circle,rgba(70,30,100,.85) 0%,rgba(127,78,158,.55) 40%,rgba(127,78,158,0) 70%);animation:i2 11s ease-in-out infinite}
.ink-l i:nth-child(3){width:48%;height:42%;left:28%;top:22%;background:radial-gradient(circle,rgba(176,140,203,.9) 0%,rgba(176,140,203,0) 68%);animation:i1 7s ease-in-out infinite reverse}
.shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(38% 26% at 34% 22%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%);box-shadow:inset -8px -12px 22px rgba(70,40,100,.22),inset 6px 8px 16px rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.7)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes i1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18%,-14%) scale(1.15)}}
@keyframes i2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-20%,22%) scale(.85)}}
.orbtip{position:fixed;right:calc(94px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:40;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.note{font-size:12px;color:var(--ink3);margin-top:22px}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.ed{grid-template-columns:minmax(0,1fr)}.prev{position:static;flex-direction:row;flex-wrap:wrap}.prev>*{flex:1 1 280px}.screen{max-width:320px}}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:70;transform:translateX(-100%);transition:transform .35s cubic-bezier(.22,1,.36,1);height:100%}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(20,14,46,.35)}
  .iconbtn.burger{display:grid}
  .g3,.g21,.g12,.split{grid-template-columns:minmax(0,1fr)}
  .detail{position:static}
  .me div{display:none}.me{padding:4px}
}
@media (max-width:640px){
  .main{padding-inline:16px}
  .g4,.g2,.f2,.f3{grid-template-columns:minmax(0,1fr)}
  .livepill span.lt,.search kbd{display:none}
  .top .search{display:none}
  .kpi{min-height:0}
  .flow{grid-template-columns:minmax(0,1fr)}.flow svg{transform:rotate(90deg)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .orbtip{display:none}
  .stp{grid-template-columns:52px minmax(0,1fr)}.stp .grip{display:none}.stp>:last-child{grid-column:1/-1}
}
</style>

function draftModel(){const d=S.draft||'g1';let title='Sleep before a night shift',src='Created from AI request · 214 members asked',cat='Sleep';
 if(d.startsWith('g')){const g=GAPS.find(x=>x.id===d);if(g){title=g.title;cat=g.cat;src=`Created from AI request · ${g.n} members asked`}}
 else if(d.startsWith('idea:')){title=d.slice(5);src='Created from a recommendation';cat='—'}
 else if(d.startsWith('lib:')){const c=byId(d.slice(4));if(c){title=c.name;cat=c.cat;src=`${STATUS[c.st][1]} · v${c.v||1} · editing creates v${(c.v||0)+1}`}}
 return {title,src,cat}}

  <h4 style="font-size:13px;margin:18px 0 6px;color:var(--ink2)">Checks</h4>
  <div>${q.checks.map(k=>`<div class="chk"><i class="${k[0]}">${k[0]==='ok'?'✓':k[0]==='w'?'!':'×'}</i><span>${esc(k[1])}</span></div>`).join('')}</div>
  <h4 style="font-size:13px;margin:18px 0 6px;color:var(--ink2)">What changed</h4>
  <div class="brief"><b>v${c.v||0} → v${(c.v||0)+1}</b>${q.id==='jet'?'Steps 1–2: light timing now depends on flight direction. Eastbound: seek morning light on arrival; westbound: seek late-afternoon light.':q.id==='fly'?'New 40-second intro. Line 14 must be rewritten: say "helps you feel calmer", not "cures anxiety".':q.id==='caff'?'No content change. Confirm the evidence still holds and set the next review date.':'New journey with 5 stages and 12 blocks, built from signed items only.'}</div>
  <div class="fld"><label for="rv-c">Comment for the author</label><textarea id="rv-c" placeholder="Optional"></textarea></div>
  <div class="acts" style="margin-top:14px"><button class="btn" ${blocked?'disabled style="opacity:.45;cursor:not-allowed"':''} data-toast="Signed by Dr. Elena Ricci · added to the audit log">${ic('check',15,2.2)}Sign off</button><button class="ghost" data-toast="Changes requested">Request changes</button></div>
  ${blocked?'<p class="down" style="font-size:12px;margin:10px 0 0">Fix the blocked wording before signing.</p>':''}
  <h4 style="font-size:13px;margin:22px 0 6px;color:var(--ink2)">Audit log</h4>
  <div class="rows">${[['Submitted for review',q.from==='Studio AI'?'Studio AI':person(q.from).name,q.wait+' ago'],['House rules check','Studio AI',q.wait+' ago'],['Created','Studio AI draft · edited by author','3 days ago']].map(r=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="ti"><b style="font-size:13px">${r[0]}</b><span>${r[1]}</span></div><span class="mono muted">${r[2]}</span></div>`).join('')}</div>
 </aside></div>`};

V.media=()=>`

<div class="kan">${MEDIA.map(([col,items])=>`<div class="col"><h4>${col}<span>${items.length}</span></h4>${items.map(i=>`<div class="kc"><div class="thumb ${i[1]==='Audio'?'au':''}">${ic(i[1]==='Audio'?'headph':'play',20,1.8,i[1]==='Audio'?'none':'#fff')}</div><b>${esc(i[0])}</b><div class="m"><span class="tchip">${i[1]}</span><span>${i[3]}</span></div><div class="m"><span style="display:flex;align-items:center;gap:6px"><span class="av" style="width:22px;height:22px;font-size:9px">${i[2]}</span>${person(i[2]).name}</span></div></div>`).join('')}</div>`).join('')}</div>
<div class="grid g3">
 <section class="glass card"><div class="ch"><h3>Most played audio</h3><span class="s">30 days</span></div>${hbars([['NSDR reset',24],['Evening wind-down',21],['Box breathing',11],['Jet lag sessions',18]],'k')}</section>
 <section class="glass card"><div class="ch"><h3>Most watched video</h3><span class="s">30 days</span></div>${hbars([['Flight nerves',5.4],['Caffeine timing',3.8],['Cycle sync intro',2.9]],'k')}</section>
 <section class="glass card"><div class="ch"><h3>Where people stop</h3><span class="s">average</span></div>${hbars([['Audio, under 10 min',91],['Audio, 15–20 min',78],['Video, over 6 min',54]])}</section>
</div>`;

V.evidence=()=>`
<div class="ph"><div><div class="eyebrow">${ic('flask',14)} No source, no submission</div><h1>Evidence</h1><p>The source library the AI is allowed to cite. Drafts can only reference what is here. Evidence watch flags new studies on topics already in the library.</p></div><div class="acts"><button class="btn" data-toast="Add source opened">${ic('plus',16,2.2)}Add source</button></div></div>
<div class="grid g12">
 <section class="glass card"><div class="ch"><h3>Evidence watch</h3><span class="s">example alerts</span></div><div class="rows">${[['New trial on timed light and eastward travel','Matches Jet lag reset · steps 1–2','Open review'],['Updated guideline on shift-work sleep','Matches the night-shift draft','Compare'],['Review on caffeine timing','Matches an overdue video','Compare']].map(r=>`<div class="row" style="grid-template-columns:36px minmax(0,1fr)"><span class="ic">${ic('flask',16)}</span><div class="ti"><b>${r[0]}</b><span>${r[1]}</span><button class="lnk" style="margin-top:6px" data-toast="Review task created">${r[2]} ${ic('arrow',12)}</button></div></div>`).join('')}</div></section>
 <section class="glass card"><div class="ch"><h3>Source library</h3><span class="s">${SRC.length} sources · titles are examples</span></div><div class="tw"><table><thead><tr><th>Source</th><th>Type</th><th>Grade</th><th>Used in</th><th>Checked</th></tr></thead><tbody>${SRC.map(s=>`<tr><td><b style="font-weight:600">${esc(s.t)}</b><span style="display:block;font-size:12px;color:var(--ink3)">added by ${s.by==='Studio AI'?'Studio AI':person(s.by).name}</span></td><td style="white-space:nowrap">${s.k}</td><td><span class="pill ${s.g==='A'?'live':s.g==='B'?'v':'med'}">${s.g}</span></td><td style="font-size:12.5px">${s.l.join(', ')}</td><td class="mono" style="white-space:nowrap">${s.chk}</td></tr>`).join('')}</tbody></table></div></section>
</div>`;

V.outcomes=()=>`
<div class="ph"><div><div class="eyebrow">${ic('target',14)} Real life, not only trials</div><h1>Outcomes</h1><p>Check-in answers and wearable trends after each protocol, aggregated across members. Groups smaller than 50 are hidden.</p></div><div class="acts"><div class="seg"><button aria-pressed="true">90 days</button><button aria-pressed="false">12 months</button></div></div></div>
<section class="glass card" style="margin-top:18px"><div class="ch"><h3>By protocol</h3><span class="s">"felt better" = check-in of 4 or 5 out of 5</span></div><div class="tw"><table><thead><tr><th>Protocol</th><th class="r">Check-ins</th><th>Felt better</th><th class="r">Sleep vs member's baseline</th><th class="r">Completion</th><th>Main drop-off</th></tr></thead><tbody>${OUT.map(o=>{const c=byId(o.id);return `<tr><td><div class="tname">${tIcon(c)}<div><b>${esc(c.name)}</b><span>${c.type}</span></div></div></td><td class="r">${fmt(o.ci)}</td><td style="min-width:160px"><div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1"><b style="width:${o.fb}%;background:${o.fb<65?'var(--warn)':'var(--violet)'}"></b></div><span class="num" style="width:36px;text-align:right">${o.fb}%</span></div></td><td class="r">${o.sl}</td><td class="r">${o.cpl}%</td><td class="${o.drop.includes('42')?'down':''}" style="white-space:nowrap">${o.drop}</td></tr>`}).join('')}</tbody></table></div></section>
<div class="grid g2">
 <section class="glass card"><div class="ch"><h3>Calm travel days · where members stop</h3><span class="s">620 starts</span></div>${hbars([['Step 1 · Breathing',100],['Step 2 · Walk',86],['Step 3 · Cold exposure',50],['Step 4 · Wind-down',45]])}<div class="acts" style="margin-top:12px"><button class="btn v" style="min-height:36px;font-size:13px" data-go="create" data-draft="lib:calm">${ic('edit',14)}Revise step 3</button></div></section>
 <section class="glass card"><div class="ch"><h3>How data is used here</h3></div>${[['Aggregated only','Clinicians see groups of 50 or more, never one member.'],['Wearable data stays with the member','Only averages leave the device account, with consent.'],['Check-ins are optional','A one-tap 1–5 score after each protocol.']].map(r=>`<div class="chk"><i class="ok">${ic('lock',11,2.2)}</i><span><b>${r[0]}</b>${r[1]}</span></div>`).join('')}</section>
</div>`;

V.team=()=>`
<div class="ph"><div><div class="eyebrow">${ic('users',14)} Scientific Advisory Board and creators</div><h1>Team &amp; SAB</h1><p>Who writes, who reviews, and how much review time each person gives the Studio.</p></div><div class="acts"><button class="btn" data-toast="Invite sent">${ic('plus',16,2.2)}Invite</button></div></div>
<div class="grid g3">${TEAM.map(t=>`<article class="glass card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:44px;height:44px;font-size:15px">${t.id}</span><div class="ti"><b>${t.name}${t.me?' <span class="pill v">You</span>':''}</b><span>${t.role}</span></div></div><div class="meta"><span>Owns <b>${t.owns}</b></span><span>Reviews pending <b>${t.rev}</b></span><span><b>${t.hrs} h</b> / week</span></div><div class="bar soft"><b style="width:${Math.min(100,t.rev*22)}%"></b></div></article>`).join('')}
<article class="glass card kpi dark" style="gap:10px"><span class="l">${ic('cal',14)} SAB office hours</span><span style="font-size:20px;font-weight:600">Thursday 15 October · 17:00</span><span style="font-size:13px;color:rgba(255,255,255,.7)">3 drafts with the most demand: Night shift, Red-eye arrival, Race day.</span><button class="ghost" style="align-self:flex-start;margin-top:auto" data-toast="Added to calendar">Add to calendar</button></article></div>
<section class="glass card" style="margin-top:14px"><div class="ch"><h3>Roles</h3></div><div class="tw"><table><thead><tr><th>Can…</th><th>Creator</th><th>Clinician</th><th>SAB chair</th><th>Producer</th></tr></thead><tbody>${[['Draft with AI',1,1,1,0],['Sign off a protocol',0,1,1,0],['Sign off a new category',0,0,1,0],['Publish media',0,0,0,1],['See live usage and AI requests',1,1,1,1]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${v?'<span class="pill live">Yes</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;

V.settings=()=>`
<div class="ph"><div><div class="eyebrow">${ic('sliders',14)} Workspace</div><h1>Settings</h1><p>Alerts, house rules, privacy and the connection to the Companion.</p></div></div>
<div class="grid g2">
 <section class="glass card"><div class="ch"><h3>AI request alerts</h3></div><div class="f2"><div class="fld"><label for="s1">Alert me when a cluster reaches</label><input id="s1" value="50 members in 7 days"></div><div class="fld"><label for="s2">Weekly digest</label><select id="s2"><option>Monday 08:30</option><option>Friday 16:00</option></select></div></div><div class="fld"><label for="s3">Send alerts to</label><select id="s3"><option>Studio and email</option><option>Studio only</option></select></div></section>
 <section class="glass card"><div class="ch"><h3>Privacy</h3></div><div class="fld"><label for="s4">Smallest group shown</label><input id="s4" value="20 members (requests) · 50 (outcomes)"></div><div class="chk"><i class="ok">${ic('lock',11,2.2)}</i><span><b>No individual data in the Studio</b>Asks are stripped of names, places and dates before grouping.</span></div></section>
 <section class="glass card"><div class="ch"><h3>House rules</h3><span class="s">checked on every draft</span></div>${[['Block treatment words ("cures", "treats", "heals")',1],['Every step needs a source from the library',1],['Contraindications required for Structured items',1],['Yearly review date on every live item',1],['Plain language, reading age 12',1]].map(r=>`<div class="chk"><i class="ok">✓</i><span>${r[0]}</span></div>`).join('')}</section>
 <section class="glass card"><div class="ch"><h3>Connections</h3></div>${[['Virtusan Companion','Live library API · reads only signed items','live'],['Dragonpass','Locations and experiences feed','review'],['Wearables (aggregated)','Apple Health, Oura, WHOOP, Garmin via the Companion','live']].map(r=>`<div class="row" style="grid-template-columns:36px minmax(0,1fr) auto"><span class="ic">${ic('link',16)}</span><div class="ti"><b>${r[0]}</b><span>${r[1]}</span></div><span class="pill ${r[2]==='live'?'live':'review'}">${r[2]==='live'?'Connected':'Requested'}</span></div>`).join('')}</section>
</div>`;

/* ---------- render ---------- */
function render(){const v=$('#view');v.innerHTML=`<div class="view">${(V[S.route]||V.overview)()}</div>`;bindView()}
function bindView(){
 document.querySelectorAll('#ltype button').forEach(b=>b.onclick=()=>{S.live=b.dataset.t;render()});
 document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;render()});
 document.querySelectorAll('#libt button').forEach(b=>b.onclick=()=>{S.lib=b.dataset.t;render()});
 document.querySelectorAll('[data-gapsel]').forEach(b=>{const f=()=>{S.gap=b.dataset.gapsel;render()};b.onclick=f;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
 document.querySelectorAll('[data-revsel]').forEach(b=>{const f=()=>{S.rev=b.dataset.revsel;render()};b.onclick=f;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
 document.querySelectorAll('.seg:not([id]) button').forEach(b=>b.addEventListener('click',()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
}

/* ---------- live simulation ---------- */
let fp=0;
setInterval(()=>{
 S.active=Math.max(900,S.active+Math.round((Math.random()-.45)*18));S.today+=Math.round(4+Math.random()*9);if(Math.random()<.3)S.fallback++;
 C.forEach(c=>{if(c.st==='live')c.now=Math.max(3,c.now+Math.round((Math.random()-.48)*4))});
 $('#activeNow').textContent=fmt(S.active);
 const k1=$('#k1'),k2=$('#k2'),k3=$('#k3');if(k1)k1.textContent=fmt(S.active);if(k2)k2.textContent=fmt(S.today);if(k3)k3.innerHTML=fmt(S.fallback)+'<small>today</small>';
 document.querySelectorAll('[data-now]').forEach(e=>{const v=byId(e.dataset.now).now;if(+e.textContent!==v){e.textContent=v;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}});
 const lt=$('#liveTop');if(lt&&Math.random()<.25)lt.innerHTML=liveRows(ranked());
},2200);
setInterval(()=>{const p=FEEDPOOL[fp++%FEEDPOOL.length];const f={i:p[0],t:p[1],gap:p[2],time:'now',n:1};FEED.forEach(x=>{x.n=0;x.time=x.time==='now'?'1 min':x.time.replace(/^(\d+)/,m=>+m+1)});FEED.unshift(f);FEED.length=8;const el=$('#feed');if(el)el.innerHTML=FEED.map(feedItem).join('');$('#lastc').textContent='just now';setTimeout(()=>{const l=$('#lastc');if(l)l.textContent='1 min ago'},30000)},4500);

/* ---------- overlays ---------- */
function closeOv(){$('#overlay').innerHTML='';document.documentElement.style.overflow=''}
function openPanel(html){$('#overlay').innerHTML=`<div class="scrim" id="scrim"></div><aside class="panel" role="dialog" aria-modal="true">${html}</aside>`;$('#scrim').onclick=closeOv;$('#overlay').querySelector('[data-close]').onclick=closeOv}
$('#bell').innerHTML+=ic('bell',19);
$('#bell').onclick=()=>{openPanel(`<div class="hd"><h3>Notifications</h3><button class="iconbtn" data-close aria-label="Close">${ic('x',18)}</button></div>${NOTIF.map(n=>`<button class="glass card" style="text-align:left;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;border-radius:18px;padding:14px" data-go="${n[3]}"><span class="ic">${ic(n[0],16)}</span><span style="font-size:13.5px">${n[1]}<span class="mono muted" style="display:block;margin-top:4px">${n[2]}</span></span></button>`).join('')}`);$('#overlay').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',closeOv))};
const AIQ={'What should we write next?':'Top three by demand and fit:<ul><li><b>Sleep before a night shift</b>: 214 members in 7 days, no good match today.</li><li><b>Red-eye arrival day</b>: 412 overnight flights land before 08:00 this month.</li><li><b>Eastbound Jet lag variant</b>: December eastbound flights up 38%.</li></ul>I can open a draft for any of them.',
 'Why is Calm travel days dropping?':'Completion fell from 66% to 58% in 8 weeks. 42% of members stop at step 3 (cold exposure), mostly in hotel rooms without a bath. A no-equipment variant would likely fix it.',
 'Summarise this week for the SAB':'This week: 38k sessions a day (+5%), 749 asks without a good match in 6 clusters, 4 items waiting for sign-off, 1 overdue review. Suggested agenda for Thursday: night shift draft, red-eye arrival, Race day.'};
$('#orb').onclick=()=>{openPanel(`<div class="hd"><h3>Studio AI</h3><button class="iconbtn" data-close aria-label="Close">${ic('x',18)}</button></div><p class="muted" style="margin:0;font-size:13px">Answers from live usage, AI requests and the library. It drafts; clinicians decide.</p><div id="chat" style="display:flex;flex-direction:column;gap:10px"><div class="msg">Hi Elena. 3 clusters crossed your alert threshold since Friday. Want the list?</div></div><div style="display:flex;flex-wrap:wrap;gap:6px">${Object.keys(AIQ).map(q=>`<button class="ghost sm" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><form class="compose" id="cf"><input id="ci" placeholder="Ask about usage, gaps, evidence…" aria-label="Message"><button class="btn" aria-label="Send" style="width:44px;padding:0">${ic('send',16)}</button></form>`);
 const ask=q=>{const ch=$('#chat');ch.insertAdjacentHTML('beforeend',`<div class="msg me2">${esc(q)}</div>`);setTimeout(()=>{ch.insertAdjacentHTML('beforeend',`<div class="msg">${AIQ[q]||'In the full version I would answer from live data. For this prototype, try one of the suggested questions.'}</div>`)},500)};
 $('#overlay').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
 $('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(v){ask(v);$('#ci').value=''}}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q').focus()}});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.toLowerCase();const hit=C.find(c=>c.name.toLowerCase().includes(v));if(hit&&v){S.lib='All';go(hit.type==='Journey'?'journeys':'library');toast('Found: '+hit.name)}else if(v){toast('No match in the library')}}});
$('#burger').innerHTML=ic('menu',19);$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#sic').innerHTML=ic('search',16);

const h=(location.hash||'').slice(1);if(V[h])S.route=h;
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(V[r]&&r!==S.route)go(r)});
renderNav();render();
</script>
